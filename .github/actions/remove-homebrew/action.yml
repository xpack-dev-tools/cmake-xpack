name: 'Remove Homebrew'
description: 'Removes Homebrew from macOS runners to avoid conflicts'
runs:
  using: 'composite'
  steps:
    - name: Remove Homebrew
      shell: bash
      run: |
        echo "Removing Homebrew to avoid conflicts..."
        NONINTERACTIVE=1 /bin/bash -c "$(curl -fsSL https://raw.githubusercontent.com/Homebrew/install/HEAD/uninstall.sh)" || true
        # Additional cleanup for any remaining files
        sudo rm -rf /opt/homebrew
        sudo rm -rf /usr/local/Homebrew
        sudo rm -rf /usr/local/bin/brew
        # Update PATH to remove Homebrew references
        echo 'export PATH=$(echo $PATH | tr ":" "\n" | grep -v homebrew | tr "\n" ":")' >> $GITHUB_ENV
        # Verify removal
        which brew || echo "Homebrew successfully removed"
